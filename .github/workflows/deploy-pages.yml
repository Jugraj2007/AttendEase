name: Deploy AttendEase to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: attendease-react/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix attendease-react

      - name: Build site
        run: npm run build --prefix attendease-react
        env:
          GITHUB_PAGES: 'true'

      - name: Verify Pages bundle
        run: |
          test -s dist/index.html
          test -s dist/favicon.svg
          grep -Eq 'src="/AttendEase/assets/[^"]+\.js"' dist/index.html
          grep -Eq 'href="/AttendEase/assets/[^"]+\.css"' dist/index.html

      - name: Generate static entry points for React routes
        run: |
          for route in \
            login \
            admin/dashboard admin/users admin/academics admin/attendance admin/corrections admin/settings \
            faculty/dashboard faculty/mark faculty/history faculty/corrections faculty/classes faculty/profile \
            student/dashboard student/attendance student/corrections student/subjects student/profile
          do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
          cp dist/index.html dist/404.html
          test -s dist/login/index.html
          test -s dist/admin/dashboard/index.html
          test -s dist/faculty/mark/index.html
          test -s dist/student/attendance/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
