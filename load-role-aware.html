<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AttendEase | Loading...</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0B1120;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;color:white}
.loader-box{width:450px;text-align:center;padding:20px}.logo{font-size:52px;margin-bottom:15px}
h1{font-size:42px;color:#3B82F6;font-weight:700;letter-spacing:1px}
p{color:#94A3B8;font-size:18px;margin-top:10px;margin-bottom:40px}
.progress{width:100%;height:18px;border:2px solid #2563EB;border-radius:30px;overflow:hidden;background:#111827;box-shadow:0 0 20px rgba(37,99,235,.3)}
.progress-bar{width:0%;height:100%;border-radius:30px;background:linear-gradient(90deg,#2563EB,#22C55E);animation:loading 3s linear forwards}
@keyframes loading{from{width:0%}to{width:100%}}
.loading-text{margin-top:25px;font-size:18px;color:#CBD5E1;letter-spacing:2px}
.dots::after{content:"";animation:dots 1.2s infinite}
@keyframes dots{0%{content:""}33%{content:"."}66%{content:".."}100%{content:"..."}}
.bottom-text{margin-top:45px;font-size:14px;color:#64748B}
</style>
</head>
<body>
<div class="loader-box">
<div class="logo">📋</div>
<h1>AttendEase</h1>
<p>Online Attendance Management System</p>
<div class="progress"><div class="progress-bar"></div></div>
<div class="loading-text">Loading<span class="dots"></span></div>
<div class="bottom-text">Please wait while we prepare your dashboard...</div>
</div>

<script>
setTimeout(function () {

    const session = JSON.parse(
        localStorage.getItem("attendEaseSession") || "null"
    );

    if (!session) {
        window.location.href = "index.html";
        return;
    }

    console.log("AttendEase Session:", session);

    if (session.role === "admin") {

        window.location.href =
            "admin-dashboard.html";

    } 
    else if (session.role === "faculty") {

        window.location.href =
            "faculty-dashboard.html";

    } 
    else if (session.role === "student") {

        window.location.href =
            "student-dashboard.html";

    } 
    else {

        console.error(
            "Unknown role:",
            session.role
        );

        localStorage.removeItem(
            "attendEaseSession"
        );

        window.location.href =
            "index.html";
    }

}, 3000);
</script>
</body>
</html>
